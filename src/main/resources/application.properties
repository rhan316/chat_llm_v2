spring.application.name=Spring_AI

server.address=127.0.0.1
server.port=0

spring.http.clients.connect-timeout=10s
spring.http.clients.read-timeout=45s
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=always

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:127.0.0.1}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION:documentation}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:false}
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}

openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=https://openrouter.ai/api/v1

spring.ai.model.embedding=openai
spring.ai.openai.embedding.base-url=${openrouter.base-url}
spring.ai.openai.embedding.api-key=${openrouter.api-key}
spring.ai.openai.embedding.model=voyageai/voyage-4-lite
spring.ai.openai.embedding.encoding-format=float

logging.level.org.springframework.ai.openai=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.http.client=DEBUG

mentor.rerank.openrouter.base-url=${openrouter.base-url}
mentor.rerank.openrouter.api-key=${openrouter.api-key}
mentor.rerank.openrouter.model=voyageai/rerank-2.5

spring.ai.model.chat=openai
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

ai.api.url=${openrouter.base-url}
ai.api.key=${openrouter.api-key}
ai.summary.model=qwen/qwen3.7-flash

stackoverflow.api.base-url=https://api.stackexchange.com
stackoverflow.api.key=${STACKOVERFLOW_API_KEY:}

github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN:}

github.index.max-files=500
github.index.max-file-size-bytes=524288
github.index.max-total-bytes=8388608
github.index.max-chunks=10000

spring.ai.openai.api-key=${openrouter.api-key}
spring.ai.openai.chat.model=${ai.summary.model}